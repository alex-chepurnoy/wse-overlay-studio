<link rel="stylesheet" href="wse-plugins/server/overlay-studio/css/overlay-studio.css?v=1.3.0">
<div class="ovs-plugin" id="ovs-root" data-theme="light">

  <header class="ovs-head" data-head>
    <div class="ovs-logo" aria-hidden="true" data-icon="overlay"></div>
    <h1>Overlay Studio</h1>
    <label class="appl" for="ovs-app">Application</label>
    <select id="ovs-app" data-app aria-label="Application"></select>
    <div class="strip" role="group" aria-label="Status, opens details" data-strip></div>
    <button class="btn sm strip-mini" type="button" data-status-open="capture">Status</button>
    <span class="spacer"></span>
    <span class="ro-chip" data-ro-chip hidden><span data-icon="lock"></span>Read-only</span>
    <button class="btn sm ghost" type="button" data-act="help" aria-label="Help and keyboard shortcuts" title="Help and keyboard shortcuts (?)">Help</button>
    <button class="btn sm ghost icon" type="button" data-act="settings" aria-label="Settings" title="Settings"></button>
    <button class="btn sm ghost icon" type="button" data-act="theme" aria-label="Dark theme" title="Dark theme" aria-pressed="false"></button>
  </header>

  <div class="banners" aria-live="polite"></div>

  <div class="ovs-grid" data-grid>
    <nav class="pnl ovs-left" data-left aria-label="Overlay Studio objects">
      <div class="ltabs" role="tablist" aria-label="Lists">
        <button type="button" role="tab" data-tab="onair" aria-selected="true" tabindex="0">On air</button>
        <button type="button" role="tab" data-tab="overlays" aria-selected="false" tabindex="-1">Overlays</button>
        <button type="button" role="tab" data-tab="templates" aria-selected="false" tabindex="-1">Templates</button>
        <button type="button" role="tab" data-tab="streams" aria-selected="false" tabindex="-1">Streams</button>
      </div>
      <div class="ltab-select"><select data-tab-select aria-label="List">
        <option value="onair">On air</option><option value="overlays">Overlays</option><option value="templates">Templates</option><option value="streams">Streams</option>
      </select></div>
      <div data-list></div>
    </nav>

    <section class="ovs-center" data-center aria-live="polite">
      <div data-screen="home" hidden></div>
      <div data-screen="stream" hidden></div>
      <div data-screen="overlay" hidden></div>
      <div data-screen="new-overlay" hidden></div>
      <div data-screen="template" hidden></div>
      <div data-screen="order" hidden></div>
      <div data-screen="nomodule" hidden></div>
      <div data-screen="task" hidden></div>
    </section>

    <aside class="pnl ovs-insp" data-insp aria-label="Inspector" hidden></aside>
  </div>

  <div data-drawer-root></div>
  <div class="toasts" aria-live="polite" data-toasts></div>
</div>
<script src="wse-plugins/server/overlay-studio/vendor/hls.min.js?v=1.6.16"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-core.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-fields.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-draw.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-images.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-format.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-store.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-server.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-home.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-stream.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-overlay.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-template.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-order.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-task.js?v=1.3.0"></script>
<script src="wse-plugins/server/overlay-studio/js/ovs-shell.js?v=1.3.0"></script>
<script>window.OverlayStudio.init(document.getElementById('ovs-root'));</script>
