<link rel="stylesheet" href="wse-plugins/server/url-overlay/css/url-overlay.css?v=1.3.0">
<div class="uo-plugin" id="uo-root" data-theme="light">

  <header class="uo-head" data-head>
    <div class="uo-logo" aria-hidden="true" data-icon="overlay"></div>
    <h1>URL Overlay</h1>
    <label class="appl" for="uo-app">Application</label>
    <select id="uo-app" data-app aria-label="Application"></select>
    <div class="strip" role="group" aria-label="Status, opens details" data-strip></div>
    <button class="btn sm strip-mini" type="button" data-status-open="capture">Status</button>
    <span class="spacer"></span>
    <span class="ro-chip" data-ro-chip hidden><span data-icon="lock"></span>Read-only</span>
    <button class="btn sm ghost" type="button" data-act="help" aria-label="Help and keyboard shortcuts" title="Help and keyboard shortcuts (?)">Help</button>
    <button class="btn sm ghost icon" type="button" data-act="theme" aria-label="Dark theme" title="Dark theme" aria-pressed="false"></button>
  </header>

  <div class="banners" aria-live="polite"></div>

  <div class="uo-grid" data-grid>
    <nav class="pnl uo-left" data-left aria-label="URL Overlay objects">
      <div class="ltabs" role="tablist" aria-label="Lists">
        <button type="button" role="tab" data-tab="onair" aria-selected="true" tabindex="0">On air</button>
        <button type="button" role="tab" data-tab="overlays" aria-selected="false" tabindex="-1">Overlays</button>
        <button type="button" role="tab" data-tab="templates" aria-selected="false" tabindex="-1">Templates</button>
        <button type="button" role="tab" data-tab="streams" aria-selected="false" tabindex="-1">Streams</button>
      </div>
      <div class="ltab-select"><select data-tab-select aria-label="List">
        <option value="onair">On air</option><option value="overlays">Overlays</option><option value="templates">Templates</option><option value="streams">Streams</option>
      </select></div>
      <div data-list></div>
    </nav>

    <section class="uo-center" data-center aria-live="polite">
      <div data-screen="home" hidden></div>
      <div data-screen="stream" hidden></div>
      <div data-screen="overlay" hidden></div>
      <div data-screen="new-overlay" hidden></div>
      <div data-screen="template" hidden></div>
      <div data-screen="order" hidden></div>
      <div data-screen="nomodule" hidden></div>
    </section>

    <aside class="pnl uo-insp" data-insp aria-label="Inspector" hidden></aside>
  </div>

  <div data-drawer-root></div>
  <div class="toasts" aria-live="polite" data-toasts></div>
</div>
<script src="wse-plugins/server/url-overlay/vendor/hls.min.js?v=1.6.16"></script>
<script src="wse-plugins/server/url-overlay/js/uo-core.js?v=1.3.0"></script>
<script src="wse-plugins/server/url-overlay/js/uo-fields.js?v=1.3.0"></script>
<script src="wse-plugins/server/url-overlay/js/uo-store.js?v=1.3.0"></script>
<script src="wse-plugins/server/url-overlay/js/uo-server.js?v=1.3.0"></script>
<script src="wse-plugins/server/url-overlay/js/uo-home.js?v=1.3.0"></script>
<script src="wse-plugins/server/url-overlay/js/uo-stream.js?v=1.3.0"></script>
<script src="wse-plugins/server/url-overlay/js/uo-overlay.js?v=1.3.0"></script>
<script src="wse-plugins/server/url-overlay/js/uo-template.js?v=1.3.0"></script>
<script src="wse-plugins/server/url-overlay/js/uo-order.js?v=1.3.0"></script>
<script src="wse-plugins/server/url-overlay/js/uo-shell.js?v=1.3.0"></script>
<script>window.UrlOverlay.init(document.getElementById('uo-root'));</script>
