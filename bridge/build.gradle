// The Manager bridge: a Spring controller that WSE Manager's own component scan loads from manager/temp, which the
// Manager mounts as its WEB-INF/classes (docs/DESIGN.md, The Manager bridge). Only its class files are installed;
// every dependency is the Manager's own, so they are compileOnly at the versions Manager 4.12.1 ships, and the
// bytecode targets Java 21, which the Manager runs on.

def spring = '6.2.19'

dependencies {
    compileOnly "org.springframework:spring-webmvc:${spring}"
    compileOnly "org.springframework:spring-web:${spring}"
    compileOnly "org.springframework:spring-context:${spring}"
    compileOnly "org.springframework:spring-core:${spring}"
    compileOnly "org.springframework:spring-beans:${spring}"
    compileOnly 'org.springframework.security:spring-security-core:6.5.9'
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    testImplementation "org.springframework:spring-test:${spring}"
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.testImplementation.extendsFrom configurations.compileOnly

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// the version /urloverlay-api/status reports, so the page can tell a missing or older bridge
def generated = layout.buildDirectory.dir('generated/version')
def bridgeVersion = tasks.register('bridgeVersion') {
    def v = project.version.toString()
    inputs.property 'version', v
    outputs.dir generated
    doLast {
        def f = generated.get().file('com/wowza/wms/webapp/urloverlay/BridgeVersion.java').asFile
        f.parentFile.mkdirs()
        f.text = "package com.wowza.wms.webapp.urloverlay;\n\n/** Generated by bridge/build.gradle. */\nfinal class BridgeVersion\n{\n\tstatic final String VERSION = \"${v}\";\n\n\tprivate BridgeVersion()\n\t{\n\t}\n}\n"
    }
}
sourceSets.main.java.srcDir(generated)
tasks.named('compileJava') { dependsOn bridgeVersion }

test {
    useJUnitPlatform()
}
